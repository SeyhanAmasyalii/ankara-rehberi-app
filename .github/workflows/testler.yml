name: Testler

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -v
      - name: Secret kontrolu
        env:
          DEMO_ANAHTAR: ${{ secrets.DEMO_ANAHTAR }}
        run: |
          if [ -z "$DEMO_ANAHTAR" ]; then echo "Secret tanimli degil!"; exit 1; fi
          echo "Secret var, uzunlugu: ${#DEMO_ANAHTAR} karakter"
          echo "Degeri yazdirmayi deniyorum: $DEMO_ANAHTAR"
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .